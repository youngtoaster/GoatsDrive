name: Build and Release GoatsDrive

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APKs & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK & SDK Components
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build GoatsDrive Receiver APK
        run: |
          ./gradlew :app:assembleRelease --stacktrace
          mkdir -p installer-app/src/main/assets
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk installer-app/src/main/assets/GoatsDrive.apk
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk installer-app/src/main/assets/GoatsDrive.apk
          fi

      - name: Build CruzeOS Launcher APK
        run: |
          ./gradlew :launcher:assembleRelease --stacktrace
          if [ -f launcher/build/outputs/apk/release/launcher-release-unsigned.apk ]; then
            cp launcher/build/outputs/apk/release/launcher-release-unsigned.apk installer-app/src/main/assets/CruzeOS-Launcher.apk
          elif [ -f launcher/build/outputs/apk/release/launcher-release.apk ]; then
            cp launcher/build/outputs/apk/release/launcher-release.apk installer-app/src/main/assets/CruzeOS-Launcher.apk
          fi

      - name: Build GoatsInstaller Companion APK
        run: |
          ./gradlew :installer-app:assembleRelease --stacktrace

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release-artifacts
          # Copy Head Unit Receiver APK
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk release-artifacts/GoatsDrive.apk
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk release-artifacts/GoatsDrive.apk
          else
            cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/GoatsDrive.apk
          fi

          # Copy Phone Companion Installer APK
          if [ -f installer-app/build/outputs/apk/release/installer-app-release-unsigned.apk ]; then
            cp installer-app/build/outputs/apk/release/installer-app-release-unsigned.apk release-artifacts/GoatsInstaller.apk
          elif [ -f installer-app/build/outputs/apk/release/installer-app-release.apk ]; then
            cp installer-app/build/outputs/apk/release/installer-app-release.apk release-artifacts/GoatsInstaller.apk
          else
            cp installer-app/build/outputs/apk/debug/installer-app-debug.apk release-artifacts/GoatsInstaller.apk
          fi

          # Copy CruzeOS 3D Launcher APK
          if [ -f launcher/build/outputs/apk/release/launcher-release-unsigned.apk ]; then
            cp launcher/build/outputs/apk/release/launcher-release-unsigned.apk release-artifacts/CruzeOS-Launcher.apk
          elif [ -f launcher/build/outputs/apk/release/launcher-release.apk ]; then
            cp launcher/build/outputs/apk/release/launcher-release.apk release-artifacts/CruzeOS-Launcher.apk
          else
            cp launcher/build/outputs/apk/debug/launcher-debug.apk release-artifacts/CruzeOS-Launcher.apk
          fi

          echo "Artifacts prepared:"
          ls -la release-artifacts/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goatsdrive-apks
          path: release-artifacts/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' && 'v1.0.0' || github.ref_name }}
          name: "GoatsDrive & CruzeOS ${{ github.ref_name == 'main' && 'v1.0.0' || github.ref_name }} — Zero-Copy Receiver, 3D Launcher & USB Sideload Deployer"
          make_latest: true
          body: |
            ## ⚡ GoatsDrive & CruzeOS v1.0.0 Release

            Ultra-lightweight, zero-copy Android Auto & CarPlay projection receiver and next-gen 3D automotive home launcher suite designed for aftermarket Android head units (FYT 7862/8581, Topway TS10/TS18, T3L).

            ### 📦 Included APKs:
            * **`GoatsDrive.apk`**: Ultra-lightweight (<45MB RAM), zero-copy Android Auto / CarPlay receiver running on the car screen.
            * **`CruzeOS-Launcher.apk`**: Next-gen Tesla/Rivian-style 3D home launcher for 2012 Chevy Cruze LTZ with real-time 3D model, CAN-bus telemetry, interactive doors/trunk, floating dual-zone climate HUD (works inside CarPlay/Android Auto), and customizable app drawer.
            * **`GoatsInstaller.apk`**: Smart phone companion app supporting **direct USB cable installation**, custom APK sideloading, Wi-Fi ADB, and factory ZLink5 replacement.

            ### 🚀 Quick Install from Your Android Phone:
            1. Download and install **`GoatsInstaller.apk`** on your Android smartphone.
            2. Choose your connection method:
               * **🔌 Direct USB Install:** Plug your phone into the head unit with a USB cable and tap **"Install via USB"**.
               * **📶 Wi-Fi / Hotspot Install:** Connect to the same network and tap **"Install via Wi-Fi"**.
            3. Choose what to install:
               * **⚡ GoatsDrive Receiver:** Automatically installs GoatsDrive, suppresses factory ZLink5, and boots it onto your car screen.
               * **🚗 CruzeOS 3D Launcher:** Sideload `CruzeOS-Launcher.apk` directly to turn your head unit into a full 3D interactive cockpit.
               * **📁 Sideload Custom APK:** Pick any `.apk` on your phone (Spotify, Waze, YouTube Music, etc.) to install directly on the head unit without needing Google Play Store or a flash drive!
          files: |
            release-artifacts/GoatsDrive.apk
            release-artifacts/CruzeOS-Launcher.apk
            release-artifacts/GoatsInstaller.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
